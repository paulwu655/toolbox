{% extends "base.html" %}
{% block title %}Base64 編碼 / 解碼{% endblock %}
{% block content %}
  <p><a href="{{ url_for('index') }}">&larr; 回首頁</a></p>
  <h1>Base64 編碼 / 解碼</h1>

  <div class="panel">
    <label for="input-text">輸入文字</label>
    <textarea id="input-text" rows="16" placeholder="在這裡輸入文字或 Base64 字串"></textarea>

    <div class="actions">
      <button id="btn-encode">編碼 →</button>
      <button id="btn-decode">解碼 →</button>
      <button id="btn-clear" class="secondary">清除</button>
    </div>

    <label for="output-text">結果</label>
    <textarea id="output-text" rows="16" readonly></textarea>
    <div class="actions">
      <button id="btn-copy" class="secondary">複製結果</button>
    </div>

    <div class="msg-row">
      <span id="error-badge" class="badge badge-danger"></span>
      <span id="copy-badge" class="badge badge-success">已複製</span>
    </div>
  </div>

  <script>
    const inputEl = document.getElementById('input-text');
    const outputEl = document.getElementById('output-text');
    const errBadge = document.getElementById('error-badge');
    const copyBadge = document.getElementById('copy-badge');
    let copyBadgeTimer = null;

    function showBadge(el, duration) {
      el.classList.add('show');
      if (duration) {
        clearTimeout(copyBadgeTimer);
        copyBadgeTimer = setTimeout(() => el.classList.remove('show'), duration);
      }
    }
    function hideBadge(el) {
      el.classList.remove('show');
    }

    async function call(endpoint) {
      hideBadge(errBadge);
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: inputEl.value }),
      });
      const data = await res.json();
      if (!res.ok) {
        errBadge.textContent = data.error || '發生錯誤';
        showBadge(errBadge);
        outputEl.value = '';
        return;
      }
      outputEl.value = data.result;
    }

    document.getElementById('btn-encode').addEventListener('click', () => call('/tools/base64/api/encode'));
    document.getElementById('btn-decode').addEventListener('click', () => call('/tools/base64/api/decode'));
    document.getElementById('btn-clear').addEventListener('click', () => {
      inputEl.value = '';
      outputEl.value = '';
      hideBadge(errBadge);
      hideBadge(copyBadge);
    });
    document.getElementById('btn-copy').addEventListener('click', () => {
      navigator.clipboard.writeText(outputEl.value);
      showBadge(copyBadge, 1500);
    });
  </script>
{% endblock %}
